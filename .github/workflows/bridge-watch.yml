# Notices when pyMzLib publishes a new bridge, and opens the pull request that repins mzLibR to it.
#
# This is link [C] of the release chain in the bridge project's design/RELEASING.md: published
# bridge -> the non-Python bindings pin it. It was manual, and expensively so — R/install-bridge.R
# carried four SHA-256 digests transcribed by hand, with a comment admitting "bumping this means
# re-recording all four". pyMzLib #31 ended that by publishing a SHA256SUMS manifest on every
# release, so the digests can now be read from the same run that produced the files.
#
# This repins the raw `mzlib-bridge-<rid>.tar.gz` assets. It used to say it repinned pyMzLib's
# WHEELS, because install-bridge.R reached the binary by unzipping one — no neutral artefact existed
# when this workflow was written, and moving off it was deliberately left as its own change so that
# neither would be reviewable at once. That change landed in #14, and there is no Python packaging
# vocabulary left in this package. The sentence outliving it is the reason the stale-prose check
# below exists at all, which makes it a slightly embarrassing place to have kept one.
#
# SHA256SUMS covers both, so nothing about the mechanism changed when the payload did.

name: bridge-watch

on:
  schedule:
    # Wednesdays, offset from pyMzLib's own Monday upstream-watch so a week where mzLib moves has
    # settled into a published bridge before this looks for one.
    - cron: "0 7 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bridge-watch
  cancel-in-progress: false

jobs:
  pin:
    name: check pyMzLib for a new bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Note whether a PAT is configured
        id: pat
        env:
          BRIDGE_WATCH_TOKEN: ${{ secrets.BRIDGE_WATCH_TOKEN }}
        run: |
          if [ -n "${BRIDGE_WATCH_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find pyMzLib's newest release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Deliberately NOT releases/latest: that endpoint skips prereleases, and every pyMzLib
          # release so far is one (the scheme is X.Y.Z.devN). The list endpoint returns newest
          # first and includes them.
          tag=$(gh api repos/smith-chem-wisc/pyMzLib/releases --jq '.[0].tag_name')
          version="${tag#v}"
          echo "newest pyMzLib release: $tag"

          # The manifest is the thing being pinned FROM, so its absence is the whole story: a plain
          # no-op with an explanation, not a failure. This used to add that no release carried one
          # "yet", which was true for one day — v0.1.0.dev4 (2026-08-09) was the first tag cut after
          # pyMzLib #31 and it publishes one. The branch stays because a release could still predate
          # #31 if this ever looks at an older tag.
          if ! gh api repos/smith-chem-wisc/pyMzLib/releases --jq '.[0].assets[].name' | grep -qx 'SHA256SUMS'; then
            echo "::notice::pyMzLib $tag publishes no SHA256SUMS asset, so there is nothing to pin from. This is expected until the first tag cut after pyMzLib #31. Nothing changed."
            echo "action=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current=$(grep -E '^MZLIB_BRIDGE_VERSION' R/install-bridge.R | sed -E 's/.*"(.*)".*/\1/')
          echo "currently pinned: $current"

          if [ "$current" = "$version" ]; then
            echo "Already pinned to $version. Nothing to do."
            echo "action=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh release download "$tag" --repo smith-chem-wisc/pyMzLib --pattern SHA256SUMS --output SHA256SUMS
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$current" >> "$GITHUB_OUTPUT"
          echo "action=bump" >> "$GITHUB_OUTPUT"

      - name: Repin from the manifest
        if: steps.upstream.outputs.action == 'bump'
        run: |
          set -euo pipefail
          Rscript scripts/regen-bridge-pins.R SHA256SUMS R/install-bridge.R "${{ steps.upstream.outputs.version }}"
          rm -f SHA256SUMS

          # The package must still parse. A generator that produces syntactically broken R would
          # otherwise be discovered by R CMD check on the pull request, which is fine, but failing
          # here names the cause instead of leaving someone to infer it from a check log.
          Rscript -e 'invisible(parse("R/install-bridge.R")); cat("install-bridge.R parses\n")'

      # Regenerating the pins updates the CODE. It does not update PROSE that happens to name the
      # old version, and prose is where this kind of staleness actually survives: nothing builds it,
      # nothing tests it, and a reader has no way to tell a current claim from a fossil. STATUS.md
      # named `v0.1.0.dev1` in exactly this way and would have gone quietly wrong on the first bump.
      #
      # So rather than assert that no such prose exists — which was true only after going and
      # looking — the watcher checks, every time, and reports what it finds in the pull request.
      # A warning and not a failure: a stale sentence is for a human to rewrite, and blocking the
      # repin on it would trade a correct pin for a tidy document.
      - name: Look for prose that still names the superseded version
        if: steps.upstream.outputs.action == 'bump'
        env:
          PREVIOUS: ${{ steps.upstream.outputs.previous }}
        run: |
          set -euo pipefail
          : > /tmp/stale.md
          hits=$(grep -rn --fixed-strings "$PREVIOUS" . \
                   --include='*.md' --include='*.R' --include='*.Rd' \
                   --exclude-dir=.git \
                 | grep -v '^\./R/install-bridge\.R:' \
                 | grep -v '^\./scripts/regen-bridge-pins\.R:' || true)
          if [ -n "$hits" ]; then
            {
              echo
              echo "### :warning: These still name \`$PREVIOUS\`"
              echo
              echo 'Regenerating the pins updates the code, not prose. Each of these is a sentence a'
              echo 'human needs to reword — preferably to point at where the value lives rather than'
              echo 'to restate it, since nothing regenerates or tests a version number in prose.'
              echo
              echo '```'
              echo "$hits"
              echo '```'
            } > /tmp/stale.md
            echo "::warning::Prose still names $PREVIOUS in $(printf '%s\n' "$hits" | wc -l) place(s); listed in the pull request."
          else
            echo "No prose names $PREVIOUS."
          fi

      - name: Compose the pull request body
        if: steps.upstream.outputs.action == 'bump'
        id: body
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          PREVIOUS: ${{ steps.upstream.outputs.previous }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "pyMzLib published **$TAG**. This repins \`R/install-bridge.R\` from"
            echo "\`$PREVIOUS\` to \`$VERSION\`, with all four SHA-256 digests regenerated by"
            echo "\`scripts/regen-bridge-pins.R\` from that release's \`SHA256SUMS\` asset."
            echo
            echo "### What to check before merging"
            echo
            echo "The digests come from the release manifest, so they are right by construction if"
            echo "the manifest is. What CI cannot tell you is whether the new bridge changes any"
            echo "**value** mzLib reports — the live canaries exercise the wire contract, not the"
            echo "numbers crossing it. If the pyMzLib release notes mention a reader or a unit"
            echo "changing, look for a caveat in this package that has become wrong."
            echo
            echo "Under \`BRIDGE-MAINTAIN-PARITY\`, a bridge bump that retires a caveat retires it"
            echo "in pyMzLib, mzLibRust **and** mzLibR as one unit of work."
            cat /tmp/stale.md
            echo
            echo "---"
            echo 'Opened by `.github/workflows/bridge-watch.yml`.'
          } > /tmp/body.md
          cat /tmp/body.md
          echo "path=/tmp/body.md" >> "$GITHUB_OUTPUT"

      - name: Open (or update) the repin pull request
        if: steps.upstream.outputs.action == 'bump'
        uses: peter-evans/create-pull-request@v6
        with:
          # What a PAT buys here is not what this comment first said. It claimed a pull request
          # opened with the default GITHUB_TOKEN starts no workflow runs and so arrives with no
          # checks. Observed on the first real run (2026-08-09, PR #10): CI DID queue, and landed as
          # `action_required` — held behind GitHub's approval gate because the author is
          # github-actions[bot]. Approving it ran the full R CMD check matrix, all green.
          #
          # So the checks are not missing, they are waiting. A PAT makes the pull request come from
          # a human account, which is what removes the gate. Set BRIDGE_WATCH_TOKEN (fine-grained
          # PAT, Contents and Pull requests read/write here) to skip the click.
          token: ${{ secrets.BRIDGE_WATCH_TOKEN || github.token }}
          branch: bridge/pymzlib-${{ steps.upstream.outputs.version }}
          title: "chore(bridge): repin to pyMzLib ${{ steps.upstream.outputs.tag }}"
          commit-message: |
            chore(bridge): repin to pyMzLib ${{ steps.upstream.outputs.tag }}

            Regenerated from the SHA256SUMS asset by scripts/regen-bridge-pins.R.
            Opened by bridge-watch.yml.
          body-path: ${{ steps.body.outputs.path }}
          labels: bridge
          delete-branch: true

      - name: Say what still needs a human
        if: steps.upstream.outputs.action == 'bump' && steps.pat.outputs.configured == 'false'
        run: |
          echo "::notice::Opened the repin pull request. Its checks are held for approval because the author is github-actions[bot] — click 'Approve workflows to run' on the PR. Set BRIDGE_WATCH_TOKEN to skip that step."
