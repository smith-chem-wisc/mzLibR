# The documentation site, built on every pull request and deployed from main.
#
# Building it runs every help-page example and every article under vignettes/articles/, against
# the recorded-response bridge in R/replay.R, so a page that errors fails the pull request. The
# site is deployed to the gh-pages branch only from main; GitHub Pages must be set to serve that
# branch for https://smith-chem-wisc.github.io/mzLibR/ to show it.
#
# pkgdown, rmarkdown and pandoc are needed here and nowhere else: the package itself still imports
# nothing but base R, and R CMD check never builds these articles (vignettes/ is .Rbuildignore'd).
name: pkgdown

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
      - name: Build the site
        # dest_dir as well as _pkgdown.yml's destination: this function defaults to docs/, which here
        # holds the repository's own markdown and which pkgdown refuses to clean.
        run: pkgdown::build_site_github_pages(dest_dir = "_site", new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: _site
