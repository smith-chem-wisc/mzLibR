name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, for the live canaries — see the `live` job.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  # The offline suite must pass with no network and no bridge staged, on every platform. That is
  # the contract: a contributor clones, runs the tests, and is green without a 140 MB payload.
  #
  # This job is also where the R port earns its cross-platform claim. It was authored only on
  # Windows R 4.6.1; the matrix below is the first time macOS, Linux, and the R 3.5 floor actually
  # run it. `bridge_platform_tag()` is tested as a table in the suite, but the OS matrix exercises
  # the real `.Platform`/`Sys.info()` values, and the old-R entry exercises the hand-rolled cache
  # path that stands in for tools::R_user_dir() (which is 4.0+).
  check:
    name: R CMD check / ${{ matrix.os }} / R ${{ matrix.r }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        r: [release]
        include:
          # One old-release check for good measure.
          #
          # R 3.5 (the DESCRIPTION floor) is deliberately NOT in this matrix: modern r-lib CI
          # tooling (pak/pkgcache) cannot install on 2018-era R, so that job can only ever produce
          # a red check, never a real result. The `>= 3.5.0` floor stays a language-feature claim,
          # held by avoiding post-3.5 syntax rather than by CI. Revisit if r-lib restores 3.5 support.
          - os: ubuntu-latest
            r: oldrel
    env:
      # No bridge, no network: the whole point of this job. MZLIB_BRIDGE is left unset so the
      # live tests skip rather than fail.
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      # check-r-package runs rcmdcheck::rcmdcheck(), which must be installed first. Without this
      # step every R CMD check job failed at setup with "there is no package called 'rcmdcheck'".
      # The package itself has no runtime deps, so this installs only the check tooling.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          # --as-cran, but the manual needs LaTeX we don't install here.
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

  # A guard that the package genuinely has no dependencies. If a future edit reaches for a package,
  # this fails loudly rather than letting the dependency creep in unnoticed — the no-dependencies
  # property is a feature, not an accident.
  no-dependencies:
    name: no package dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Assert Imports/Depends name only base + utils
        run: |
          Rscript -e '
            d <- read.dcf("DESCRIPTION")
            fields <- c(if ("Imports" %in% colnames(d)) d[, "Imports"],
                        if ("Depends" %in% colnames(d)) d[, "Depends"])
            pkgs <- trimws(unlist(strsplit(paste(fields, collapse = ","), ",")))
            pkgs <- sub("\\s*\\(.*\\)$", "", pkgs)
            pkgs <- pkgs[nzchar(pkgs) & !grepl("^R$", pkgs)]
            base <- rownames(installed.packages(priority = "base"))
            offenders <- setdiff(pkgs, c(base, "utils"))
            if (length(offenders)) stop("non-base dependency introduced: ", paste(offenders, collapse = ", "))
            cat("dependencies:", if (length(pkgs)) paste(pkgs, collapse = ", ") else "(base only)", "- OK\n")
          '

  # Live canaries against PRIDE Archive and UniProt, through a real bridge. Scheduled and manual
  # only: they cost network time and they SKIP on an outage, so a red result here is a genuine
  # contract break — mzLib, PRIDE, or UniProt changing under us.
  #
  # The staging step below fetches the published bridge tarball. Note it deliberately does NOT go
  # through mzlibr_install_bridge(): that function is the USER's path, and it still reads a wheel.
  # Using it here would make this job test the installer rather than the package, and would hide the
  # wheel dependency behind a green tick. Moving the installer onto the tarball is its own change,
  # with its own tests (gap G-asset-consumption).
  live:
    name: live canaries
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # This used to be `exit 1` with a comment saying it was waiting for a stable bridge release.
      # pyMzLib publishes raw bridge tarballs from v0.1.0.dev4 onward, so the wait is over.
      #
      # tar rather than zip is what keeps this short. R's utils::unzip() drops the execute bit, which
      # is why the package carries bridge_make_runnable() to chmod after unpacking a wheel; tar
      # restores the mode, verified on the real asset — the published linux payload records
      # `-rwxr-xr-x`. Nothing here needs a chmod.
      - name: Stage the bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The newest release, including prereleases: every pyMzLib release so far is one, and
          # `releases/latest` skips them. Tracks the newest deliberately rather than pinning — this
          # job exists to notice when the CURRENT bridge breaks the contract.
          tag=$(gh api repos/smith-chem-wisc/pyMzLib/releases --jq '.[0].tag_name')
          echo "Staging the mzLib bridge for linux-x64 from pyMzLib $tag"

          gh release download "$tag" --repo smith-chem-wisc/pyMzLib \
            --pattern 'mzlib-bridge-linux-x64.tar.gz' --pattern 'SHA256SUMS'

          # Verified against the published manifest rather than trusted to HTTPS. The package itself
          # refuses to install an executable it cannot verify; a CI job should hold the same line.
          grep 'mzlib-bridge-linux-x64.tar.gz' SHA256SUMS | sha256sum -c -

          mkdir -p _dotnet/linux-x64
          tar -xzf mzlib-bridge-linux-x64.tar.gz -C _dotnet/linux-x64

          # Prove it runs before any test blames the package for the payload.
          ./_dotnet/linux-x64/mzlib-bridge version
      - name: Install and run the full suite
        env:
          MZLIB_BRIDGE: ${{ github.workspace }}/_dotnet/linux-x64/mzlib-bridge
        run: |
          R CMD INSTALL .
          Rscript tests/run-tests.R
